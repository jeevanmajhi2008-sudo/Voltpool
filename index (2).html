<title>VoltPool</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one app, two portals. A plain landing page asks "drive or host", the header keeps a Drive | Host switch,
   and each portal has its own tabs. Calm light palette in shades of green (forest header, mint and sage surfaces), teal for hosts, with sand, sky and coral as supporting colours. Light on every device.
   Shared data (chargers, bookings, offers, chats, notifications) lives in the artifact database, so two devices stay in sync. */
:root{
  --bg:#EEF6EC; --surface:#FFFFFF; --sunk:#E5EFE7; --ink:#183126; --muted:#5B7266; --line:#D2E1D5;
  --cer:#2E7D5B; --cer-ink:#FFFFFF; --cer-soft:#DCEFE3; --rose:#1E7482; --rose-ink:#FFFFFF; --rose-soft:#DAEEF0; --mint:#7FB89A;
  --forest:#1F4D3A; --volt:#8CCB3F; --volt-deep:#5E9E2A; --volt-soft:#ECF7DC; --forest-2:#2A6049; --sand:#F6EBD4; --sand-ink:#8A5F12; --sky:#DCEBF5; --sky-ink:#2B6489; --blush:#F8E3DD; --blush-ink:#A2493A;
  --amber:#B47A12; --amber-soft:#F6EBD4; --heart:#D0604B;
  --good:#2E7D5B; --good-soft:#DCEFE3; --warn:#A86A00; --warn-soft:#F6EBD4; --bad:#B4432F; --bad-soft:#F8E3DD;
  --map-land:#E4EEE5; --map-road:#FFFFFF; --map-water:#CFE3EC; --map-park:#CDE5D2; --map-label:#6C8478;
  --glow:0; --shadow:0 1px 2px rgba(24,49,38,.06),0 6px 18px rgba(24,49,38,.06); color-scheme:light;
  --f-display:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif; --f-brand:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"DM Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#EEF6EC; --surface:#FFFFFF; --sunk:#E5EFE7; --ink:#183126; --muted:#5B7266; --line:#D2E1D5;
  --cer:#2E7D5B; --cer-ink:#FFFFFF; --cer-soft:#DCEFE3; --rose:#1E7482; --rose-ink:#FFFFFF; --rose-soft:#DAEEF0; --mint:#7FB89A;
  --forest:#1F4D3A; --volt:#8CCB3F; --volt-deep:#5E9E2A; --volt-soft:#ECF7DC; --forest-2:#2A6049; --sand:#F6EBD4; --sand-ink:#8A5F12; --sky:#DCEBF5; --sky-ink:#2B6489; --blush:#F8E3DD; --blush-ink:#A2493A;
  --amber:#B47A12; --amber-soft:#F6EBD4; --heart:#D0604B;
  --good:#2E7D5B; --good-soft:#DCEFE3; --warn:#A86A00; --warn-soft:#F6EBD4; --bad:#B4432F; --bad-soft:#F8E3DD;
  --map-land:#E4EEE5; --map-road:#FFFFFF; --map-water:#CFE3EC; --map-park:#CDE5D2; --map-label:#6C8478;
  --glow:0; --shadow:0 1px 2px rgba(24,49,38,.06),0 6px 18px rgba(24,49,38,.06); color-scheme:light; } }
:root[data-theme="dark"]{ --bg:#EEF6EC; --surface:#FFFFFF; --sunk:#E5EFE7; --ink:#183126; --muted:#5B7266; --line:#D2E1D5;
  --cer:#2E7D5B; --cer-ink:#FFFFFF; --cer-soft:#DCEFE3; --rose:#1E7482; --rose-ink:#FFFFFF; --rose-soft:#DAEEF0; --mint:#7FB89A;
  --forest:#1F4D3A; --volt:#8CCB3F; --volt-deep:#5E9E2A; --volt-soft:#ECF7DC; --forest-2:#2A6049; --sand:#F6EBD4; --sand-ink:#8A5F12; --sky:#DCEBF5; --sky-ink:#2B6489; --blush:#F8E3DD; --blush-ink:#A2493A;
  --amber:#B47A12; --amber-soft:#F6EBD4; --heart:#D0604B;

  --glow:0; --shadow:0 1px 2px rgba(24,49,38,.06),0 6px 18px rgba(24,49,38,.06); color-scheme:light; }
:root[data-theme="light"]{ --bg:#EEF6EC; --surface:#FFFFFF; --sunk:#E5EFE7; --ink:#183126; --muted:#5B7266; --line:#D2E1D5;
  --cer:#2E7D5B; --cer-ink:#FFFFFF; --cer-soft:#DCEFE3; --rose:#1E7482; --rose-ink:#FFFFFF; --rose-soft:#DAEEF0; --mint:#7FB89A;
  --forest:#1F4D3A; --volt:#8CCB3F; --volt-deep:#5E9E2A; --volt-soft:#ECF7DC; --forest-2:#2A6049; --sand:#F6EBD4; --sand-ink:#8A5F12; --sky:#DCEBF5; --sky-ink:#2B6489; --blush:#F8E3DD; --blush-ink:#A2493A;
  --amber:#B47A12; --amber-soft:#F6EBD4; --heart:#D0604B;
  --good:#2E7D5B; --good-soft:#DCEFE3; --warn:#A86A00; --warn-soft:#F6EBD4; --bad:#B4432F; --bad-soft:#F8E3DD;
  --map-land:#E4EEE5; --map-road:#FFFFFF; --map-water:#CFE3EC; --map-park:#CDE5D2; --map-label:#6C8478;
  --glow:0; --shadow:0 1px 2px rgba(24,49,38,.06),0 6px 18px rgba(24,49,38,.06); color-scheme:light; }
:root{--accent:var(--cer); --accent-ink:var(--cer-ink); --accent-soft:var(--cer-soft); --accent2:var(--rose); --accent2-soft:var(--rose-soft)}
:root[data-site="host"]{--accent:var(--rose); --accent-ink:var(--rose-ink); --accent-soft:var(--rose-soft); --accent2:var(--cer); --accent2-soft:var(--cer-soft)}
.neon-b{color:var(--cer)}
.neon-p{color:var(--rose)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb, var(--bg) 82%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--cer),var(--mint),var(--rose))}
.topin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-brand);font-weight:800;font-size:1.15rem;letter-spacing:.12em;text-transform:uppercase;background:none;border:0;padding:0;color:var(--ink)}
.brand svg{width:28px;height:28px;filter:drop-shadow(0 0 8px color-mix(in srgb, var(--accent) 60%, transparent))}
.sitetag{font-family:var(--f-mono);font-size:.68rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--accent);color:var(--accent)}
.switch{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:6px 14px;font-size:.85rem;font-weight:600;text-decoration:none;color:var(--ink);background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(90deg,var(--cer),var(--rose)) border-box;border:1.5px solid transparent;white-space:nowrap}
.switch:hover{box-shadow:0 0 18px color-mix(in srgb, var(--accent2) 45%, transparent)}
.pswitch{display:flex;border-radius:99px;padding:3px;gap:2px;background:var(--sunk);border:1px solid var(--line)}
.pswitch button{border:0;background:transparent;border-radius:99px;padding:6px 14px;font-family:var(--f-brand);font-size:.72rem;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.pswitch button[data-p="driver"][aria-pressed="true"]{background:var(--cer);color:var(--cer-ink);box-shadow:0 0 18px rgba(76,214,196,0.33)}
.pswitch button[data-p="host"][aria-pressed="true"]{background:var(--rose);color:var(--rose-ink);box-shadow:0 0 18px rgba(240,122,154,0.33)}
.livechip{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.livechip .dot{background:var(--muted)}.livechip.on{color:var(--good)}.livechip.on .dot{background:var(--good);box-shadow:0 0 8px var(--good)}
.landing{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center;min-height:calc(100vh - 160px);padding-block:12px}
@media (max-width:880px){.landing{grid-template-columns:minmax(0,1fr);min-height:0}}
.landing .eyebrow{font-family:var(--f-mono);letter-spacing:.42em;text-transform:uppercase;color:var(--muted);font-size:.78rem;line-height:1.9}
.landing h1.mega{font-family:var(--f-brand);font-size:clamp(2.5rem,7vw,5.2rem);font-weight:800;line-height:.95;letter-spacing:.02em;margin:18px 0;text-shadow:none;color:inherit}
.landing h1.mega span{display:block}
.landing h1.mega::after{display:none}
.landing .tag{font-family:var(--f-mono);letter-spacing:.38em;text-transform:uppercase;font-size:.85rem;line-height:1.9;color:var(--ink)}
.go{display:flex;align-items:center;gap:16px;background:none;border:0;padding:6px 0;color:var(--ink);text-align:left}
.go .ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;flex:none;transition:box-shadow .2s, transform .2s}
.go.b .ring{border:1.5px solid var(--cer);color:var(--cer);box-shadow:0 0 14px rgba(76,214,196,0.21)}
.go.p .ring{border:1.5px solid var(--rose);color:var(--rose);box-shadow:0 0 14px rgba(240,122,154,0.21)}
.go:hover .ring{transform:translateX(3px)}.go.b:hover .ring{box-shadow:0 0 28px rgba(76,214,196,0.42)}.go.p:hover .ring{box-shadow:0 0 28px rgba(240,122,154,0.42)}
.go b{display:block;font-family:var(--f-brand);letter-spacing:.2em;font-size:.82rem;text-transform:uppercase}
.go small{color:var(--muted);font-size:.85rem}
.art{width:100%;height:auto;display:block;max-height:72vh}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:8px}
.how div{border:1px solid var(--line);border-radius:14px;padding:16px;background:color-mix(in srgb, var(--surface) 80%, transparent)}
.how b{font-family:var(--f-brand);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;display:block;margin-bottom:6px}
.sig{border-top:1px solid var(--line);margin-top:8px}
.sigin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sigin b{font-family:var(--f-brand);letter-spacing:.2em;background:linear-gradient(90deg,var(--cer),var(--mint),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.xmark{width:22px;height:22px;display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:7px;padding:3px}
.xmark svg{width:100%;height:100%}
.sigsep::before{content:"·";margin-right:10px}
.crossbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding:14px 16px;border-radius:12px;background:linear-gradient(100deg,var(--accent2-soft),var(--accent-soft));border:1px solid var(--line)}
.crossbar p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.portal{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px;background:var(--sunk)}
.portal button{border:0;background:transparent;border-radius:99px;padding:5px 12px;font-size:.85rem;font-weight:600;color:var(--muted);position:relative}
.portal button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:var(--surface);font-size:.68rem;font-weight:600;margin-left:4px}
nav.tabs{display:flex;gap:4px;flex:1;overflow-x:auto}
nav.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:8px;font-weight:500;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.85rem;display:inline-flex;align-items:center;gap:4px}
.walletchip{font-family:var(--f-mono)}
.reset{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:.8rem;color:var(--muted)}
@media (max-width:760px){.brand{flex:1}nav.tabs{order:5;flex:0 0 100%}header .livechip{display:none}}
main{max-width:1240px;margin:0 auto;padding-block:20px 60px}
h1,h2{font-family:var(--f-display);margin:0;line-height:1.25;text-wrap:balance}
h3{font-family:var(--f-body);margin:0;line-height:1.3}
h1{font-size:1.65rem;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
h1::after{content:"";display:block;width:44px;height:3px;border-radius:2px;margin-top:8px;background:linear-gradient(90deg,var(--accent),var(--mint))}
h2{font-size:1.08rem;font-weight:600;letter-spacing:0}
h3{font-size:1rem;font-weight:600}
.panel h2,.modal h2{color:var(--ink)}
.sub{color:var(--muted);margin:4px 0 0}
.small{font-size:.82rem}
.label{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:880px){.grid2,.grid2.even{grid-template-columns:minmax(0,1fr)}}
.panel{background:color-mix(in srgb, var(--surface) 88%, transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid transparent;background:linear-gradient(120deg,var(--accent),color-mix(in srgb, var(--accent) 55%, var(--accent2))) border-box;color:var(--accent-ink);box-shadow:0 4px 18px color-mix(in srgb, var(--accent) calc(var(--glow)*100%), transparent);border-radius:8px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--accent);box-shadow:none}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#140500;box-shadow:none}
.btn.sm{padding:6px 10px;font-size:.85rem}
.btn.block{width:100%}
.btn.hero{font-size:1rem;padding:12px 18px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.check{display:flex;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:500;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.free{background:var(--good-soft);color:var(--good)}
.pill.busy{background:var(--warn-soft);color:var(--warn)}
.pill.off{background:var(--sunk);color:var(--muted)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.star{background:var(--amber-soft);color:var(--amber)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.cta{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(110deg,var(--accent),var(--accent2)) border-box;border:1.5px solid transparent;box-shadow:0 0 40px color-mix(in srgb, var(--accent) calc(var(--glow)*60%), transparent);border-radius:14px;padding:14px 16px;margin-bottom:16px}
@media (max-width:640px){.cta{grid-template-columns:1fr}}
.cta p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
.map{width:100%;height:auto;display:block;border-radius:10px;background:var(--map-land);touch-action:manipulation}
.map .pin{cursor:pointer}
.map text{font-family:var(--f-mono);fill:var(--map-label)}
.mapnote{font-size:.72rem;color:var(--muted);margin-top:6px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.card{display:grid;grid-template-columns:72px 1fr auto;gap:4px 12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;align-items:start}
.card .thumb{grid-row:span 3;width:72px;height:72px;border-radius:8px;overflow:hidden;background:var(--sunk)}
.card .thumb img,.card .thumb svg{width:100%;height:100%;object-fit:cover;display:block}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card .t{font-weight:600}
.card .m{color:var(--muted);font-size:.85rem}
.card .p{font-family:var(--f-mono);font-weight:500;text-align:right}
.strike{text-decoration:line-through;color:var(--muted);font-size:.8rem;margin-right:4px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.kv div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.kv b{display:block;font-family:var(--f-mono);font-weight:500;font-size:1rem}
.breakdown{width:100%;border-collapse:collapse;font-size:.9rem}
.breakdown td{padding:5px 0;border-bottom:1px dashed var(--line)}
.breakdown td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.breakdown tr.total td{font-weight:600;border-bottom:0;border-top:1px solid var(--ink)}
.breakdown tr.minus td:last-child{color:var(--good)}
.specs{width:100%;border-collapse:collapse;font-size:.88rem}
.specs td{padding:6px 0;border-bottom:1px solid var(--line)}
.specs td:first-child{color:var(--muted);width:45%}
input[type=range]{width:100%;accent-color:var(--accent)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:.85rem}
.okbox{background:var(--good-soft);color:var(--good);border-radius:8px;padding:8px 10px;font-size:.85rem}
.infobox{background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:8px 10px;font-size:.85rem}
.empty{color:var(--muted);text-align:center;padding:22px 12px;border:1px dashed var(--line);border-radius:10px;font-size:.9rem}
.gallery{display:flex;flex-direction:column;gap:6px}
.gmain{border-radius:10px;overflow:hidden;position:relative;aspect-ratio:20/7;background:var(--sunk);max-width:100%}
.gmain img,.gmain svg{width:100%;height:100%;object-fit:cover;display:block}
.gthumbs{display:flex;gap:6px;overflow-x:auto}
.gthumbs button{flex:none;width:58px;height:44px;border-radius:6px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--sunk)}
.gthumbs button[aria-pressed="true"]{border-color:var(--accent)}
.gthumbs img,.gthumbs svg{width:100%;height:100%;object-fit:cover;display:block}
.heart{position:absolute;top:10px;right:10px;border:0;background:var(--surface);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-size:1.1rem;color:var(--muted)}
.heart.on{color:var(--heart)}
.photocount{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:.75rem;padding:2px 8px;border-radius:99px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;padding:3px 9px;border-radius:99px;background:var(--sunk)}
.hostcard{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.review{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;font-size:.88rem}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}

.big{font-family:var(--f-mono);font-size:1.8rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}

.tblwrap{overflow-x:auto}

table.data th{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-weight:500}
table.data td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.data td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
table.data th.n{text-align:right}
table.data tr.click{cursor:pointer}
table.data tr.click:hover td{background:var(--sunk)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--good);font-weight:500}
.live .dot{animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:42px;height:42px;border:4px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:8px auto}
@media (prefers-reduced-motion:reduce){.live .dot,.spinner{animation:none}.batt i{transition:none}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:20px;width:min(440px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.chat{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;padding:4px}

.msg.them{background:var(--sunk);align-self:flex-start;border-bottom-left-radius:4px}

.chatin{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface);color:var(--ink);border:1px solid var(--accent);box-shadow:0 0 24px color-mix(in srgb, var(--accent) 40%, transparent);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
.notifpanel{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:min(380px,calc(100% - 32px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:15;padding:12px}

.notif .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:.9rem}

.stars{display:flex;gap:4px}
.stars button{border:0;background:transparent;font-size:1.6rem;line-height:1;color:var(--line);padding:2px}
.stars button.on{color:var(--amber)}
.chartbox{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.78rem;padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%)}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.req{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px}

.band{background:var(--sunk);border-radius:8px;padding:8px}

.photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photos .ph button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:20px;height:20px;background:rgba(0,0,0,.6);color:#fff;font-size:.7rem;line-height:1}
.camlabel{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--accent);color:var(--accent);border-radius:8px;padding:8px 12px;font-weight:600;font-size:.88rem;cursor:pointer}
.camlabel input{position:absolute;width:1px;height:1px;opacity:0}
.camlabel:focus-within{outline:2px solid var(--accent);outline-offset:2px}

/* Sober finish: flat surfaces, no glows, sentence-case type */
.btn{background:var(--accent)!important;box-shadow:none!important;border-color:var(--accent)!important}
.btn.ghost{background:transparent!important}

.cta{background:var(--surface)!important;border:1px solid var(--line)!important;border-left:4px solid var(--accent)!important;box-shadow:var(--shadow)!important}
.panel{background:var(--surface)!important;backdrop-filter:none!important}
.stat.hl b{background:none!important;color:var(--accent)!important}
header.top{background:var(--surface)!important;backdrop-filter:none!important}
header.top::after{background:var(--line)!important;height:1px!important}
.brand{font-size:1.1rem!important;letter-spacing:-.01em!important;text-transform:none!important;font-weight:700}
.brand svg{filter:none!important}
.pswitch button{font-family:var(--f-body)!important;letter-spacing:0!important;font-size:.85rem!important;font-weight:600}

nav.tabs button[aria-current="true"]{box-shadow:none!important}
.pin4 span{box-shadow:none!important}
.batt i{background:var(--accent)!important}
.switch{background:var(--surface)!important;border:1px solid var(--line)!important;box-shadow:none!important}
.crossbar{background:var(--sunk)!important}
#toast{background:var(--ink)!important;color:var(--bg)!important;border:0!important;box-shadow:var(--shadow)!important}
h1::after{background:var(--accent)!important}
.label{letter-spacing:.08em!important}
.landing{min-height:0!important;padding-block:24px 8px!important}

.landing h1.mega span{display:inline!important}
.landing .tag{letter-spacing:0!important;text-transform:none!important;font-family:var(--f-body)!important;font-size:1.05rem!important;color:var(--muted)!important;max-width:46ch}
.go .ring{box-shadow:none!important}
.go.b .ring{border-color:var(--cer)!important;color:var(--cer)!important}.go.p .ring{border-color:var(--rose)!important;color:var(--rose)!important}
.go b{font-family:var(--f-body)!important;letter-spacing:0!important;text-transform:none!important;font-size:1.02rem!important}
.how b{font-family:var(--f-body)!important;letter-spacing:.04em!important;font-size:.8rem!important}
.how div{background:var(--surface)!important}
.sigin{letter-spacing:.06em!important;text-transform:none!important}
.sigin b{font-family:var(--f-body)!important;letter-spacing:0!important;background:none!important;color:var(--ink)!important}
.livechip.on .dot{box-shadow:none!important}
.card[aria-pressed="true"]{box-shadow:none!important}

/* Green header band and colour-tinted tiles */
header.top{background:var(--forest)!important;border-bottom:0!important}
header.top::after{display:none}
body::before{background:var(--forest)!important}
.brand{color:#FFFFFF!important}
.brand rect{fill:#FFFFFF}.brand path{fill:var(--forest)}
.pswitch{background:var(--forest-2)!important;border-color:rgba(255,255,255,.14)!important}
.pswitch button{color:#CFE3D7!important}
.pswitch button[data-p="driver"][aria-pressed="true"]{background:#FFFFFF!important;color:var(--cer)!important}
.pswitch button[data-p="host"][aria-pressed="true"]{background:#FFFFFF!important;color:var(--rose)!important}
nav.tabs button{color:#CFE3D7!important}

header .iconbtn{background:transparent!important;border-color:rgba(255,255,255,.25)!important;color:#FFFFFF}

header .livechip{color:#CFE3D7!important}header .livechip.on{color:#BFF0D4!important}header .livechip.on .dot{background:#BFF0D4!important}
.stats .stat{border-top:3px solid var(--line)}

.landing{background:linear-gradient(135deg,#FFFFFF 0%,var(--cer-soft) 100%);border:1px solid var(--line);border-radius:20px;padding:28px!important;margin-bottom:16px}
.cta{background:linear-gradient(100deg,#FFFFFF 40%,var(--cer-soft))!important}

:root:not([data-site="host"]) .btn:not(.ghost):not(.danger){background:linear-gradient(135deg,var(--cer),var(--volt-deep))!important;border-color:var(--cer)!important}

/* Type scale: one family pair, restrained weights, sentence-case labels */
body{font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}

.sub{font-size:.94rem;color:var(--muted)}

.big{font-size:1.8rem!important;font-weight:700!important}

/* ================= data layer =================
   W is the shared world: one object per collection, keyed by document id. In the published page it mirrors the
   artifact database (live, for every viewer); without it (preview, signed out) it falls back to this browser.
   S is this viewer's own state (wallet, filters, portal) plus live views over W. save() writes S locally and
   pushes only the shared documents that changed. Each booking has one writer, its owner (the driver's device, or the
   host's device for simulated drivers); the host's decisions go to actions/<bookingId> and the owner applies them. */
const COLS = ['chargers','bookings','actions','requests','sessions','notifs','chats','settings','support'];

Object.defineProperties(S, {
  chargers:{get:()=>sortBy(Object.values(W.chargers),c=>c.order||0), enumerable:false},
  history:{get:()=>sortBy(Object.values(W.sessions),h=>h.ts||0).map(h=>Object.assign(h,{daysAgo:Math.max(0,Math.floor((Date.now()-(h.ts||0))/864e5))})), enumerable:false},
  hostReqs:{get:()=>Object.values(W.requests), enumerable:false},
  hostOffers:{get:()=>W.settings.host||(W.settings.host={}), enumerable:false},
  notifs:{get:()=>({driver:Object.values(W.notifs).filter(n=>n.role==='driver'&&(n.to===ME.id||n.to==='*')).sort((a,b)=>b.ts-a.ts),
                    host:Object.values(W.notifs).filter(n=>n.role==='host').sort((a,b)=>b.ts-a.ts)}), enumerable:false},
  trip:{get:()=>activeTrip(), set:v=>{ if(v===null){ const t=activeTrip(); if(t && ACTIVE.includes(t.status)) t.status='closed'; } else { W.bookings[v.id]=v; } }, enumerable:false}

  if(S.portal==='host'){ const mine=all.filter(t=>isMine(charger(t.chargerId))); return mine.find(t=>t.driverId!=='sim') || mine[0] || null; }

const sent = {}, pending = {}, inflight = {};
const ser = o => JSON.stringify(o, (k,v)=> (k[0]==='_' || k==='daysAgo') ? undefined : v);
function pushDoc(path, json){
  if(!db) return;
  pending[path]=json; if(inflight[path]) return;
  inflight[path]=true;
  (async()=>{ while(pending[path]!==undefined){ const j=pending[path]; delete pending[path];
      try{ await db.doc(path).set(JSON.parse(j)); }
      catch(e){ if(e && e.code==='unavailable'){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); if(pending[path]===undefined) pending[path]=j; }
        else if(e && e.code==='quota_exceeded'){ toast('The shared database is full. Older items need clearing.'); }
        else { toast('Could not save to the shared database ('+(e&&e.code||'error')+').'); break; } } }
    inflight[path]=false; })();
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){}
  for(const c of COLS) for(const id in W[c]){ const p=c+'/'+id, j=ser(W[c][id]); if(sent[p]!==j){ sent[p]=j; pushDoc(p,j); } }
  if(!db){ try{ localStorage.setItem(WORLD_KEY, JSON.stringify(W)); }catch(e){ toast('Browser storage is full. Remove a photo.'); } }
}

function readPhoto(file){
  return new Promise((res,rej)=>{
    if(!file || !file.type.startsWith('image/')) return rej(new Error('Pick an image file'));
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const max=assets?1100:480, sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas'); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      if(assets) cv.toBlob(async blob=>{ try{ const r=await assets.upload(blob); res(r.url); }catch(e){ res(cv.toDataURL('image/jpeg',0.6)); } },'image/jpeg',0.82);
      else res(cv.toDataURL('image/jpeg',0.6)); }; img.onerror=()=>rej(new Error('Could not read that image')); img.src=fr.result; };
    fr.onerror=()=>rej(new Error('Could not read that file')); fr.readAsDataURL(file);
  });
}

/* ================= DRIVER: Explore ================= */
function compatible(c){ return EVS[S.vehicle].plugs.includes(c.conn); }
function score(c){ return dist(c)*1.2 + priceOf(c).price*0.25 - c.rating*1.5 + (c.status==='busy'?6:0) - (c._featured?2:0); }
const SPEEDS = {
  fast:{label:'Fast DC', short:'Fast', note:'25 kW and up · about 1 hour for a car', cls:'spd-fast'},
  standard:{label:'Standard AC', short:'Standard', note:'7–22 kW · 3 to 5 hours for a car', cls:'spd-std'},
  slow:{label:'Slow', short:'Slow', note:'Up to 3.3 kW · scooters, e-autos, overnight', cls:'spd-slow'}
};
function speedOf(c){ return (/DC/.test(c.conn) || c.kw>=25) ? 'fast' : c.kw>=7 ? 'standard' : 'slow'; }
function speedPill(c){ const k=speedOf(c); return `<span class="pill ${SPEEDS[k].cls}">${k==='fast'?'⚡ ':''}${SPEEDS[k].short}</span>`; }
function filtered(){
  const f = S.filters;
  let list = S.chargers.filter(c=>c.active).filter(c=>{
    if(f.conn==='compatible' && !compatible(c)) return false;
    if(f.conn!=='compatible' && f.conn!=='all' && c.conn!==f.conn) return false;
    if(priceOf(c).price>f.maxPrice) return false;
    if(f.freeOnly && c.status!=='free') return false;
    if(f.instantOnly && !c.instant) return false;
    if(f.savedOnly && !S.favs.includes(c.id)) return false;
    if(f.offersOnly && !c.negotiable) return false;
    if(f.speed && f.speed!=='all' && speedOf(c)!==f.speed) return false;
    return true;
  });
  const key = {best:score, distance:c=>dist(c), price:c=>priceOf(c).price, rating:c=>-c.rating}[f.sort];
  return list.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0) || key(a)-key(b));
}
function chargeKw(c){ const v = EVS[S.vehicle]; return Math.min(c.kw, c.conn==='CCS2 DC' ? v.dc : v.ac); }
function estimate(kw, price, target, t){ const v=EVS[t?t.vehicle:S.vehicle]; const kwh=Math.max(0,(target-(t?t.battery:S.battery))/100*v.cap)/0.92; return {kwh, mins: kw ? kwh/kw*60 : 0, amount:kwh*price, kw}; }

            <span class="p">${p.changed?`<span class="strike">₹${p.base}</span>`:''}₹${p.price}</span>
            <span class="m">${c.kind} · ${c.area} · ${c.conn} · ${c.kw} kW</span><span class="m num" style="text-align:right">${dist(c).toFixed(1)} km</span>
            <span class="row" style="gap:6px"><span class="pill ${c.status==='free'?'free':'busy'}"><span class="dot"></span>${c.status==='free'?'Free':'In use'}</span>${speedPill(c)}${fitPills(c)}${compatible(c)?'':'<span class="pill nofit">Doesn\'t fit your EV</span>'}<span class="m">★ ${c.rating} · ${c.instant?'Instant':'Request'}${c.negotiable?' · Offers OK':''} · ${photoCount(c)} 📷</span></span><span></span>

const STEP_NAMES = ['Booked','On the way','Arrived','Charging','Done'];
function stepIndex(st){ return {negotiating:0, requested:0, confirmed:0, enroute:1, arrived:2, charging:3}[st]; }
function cancelFee(t){ if(t.kind==='van') return 0; if(t.status!=='enroute') return 0; const c=t.chargerId?charger(t.chargerId):null; return (c && c.cancel==='Flexible') ? 0 : 30; }

/* ================= booking flow (shared by both apps) ================= */
function checkPromo(code){
  if(!code) return {ok:true};
  const o = OFFERS.find(x=>x.code===code && x.aud==='driver');
  if(!o) return {ok:false, msg:'Coupon '+code+' is not valid. See the Offers tab for live codes.'};
  if(o.once && S.usedPromos.includes(code)) return {ok:false, msg:code+' was already used.'};
  if(!offerLive(o)) return {ok:false, msg:code+' is valid only during '+o.bands.map(b=>BANDS[b].label.toLowerCase()).join(' and ')+'.'};
  return {ok:true, code};
}
function book(c, slot, offer){
  const p=priceOf(c), price=offer||p.price, est=estimate(chargeKw(c), price, S._target||80);
  const hold=Math.ceil(est.amount*1.1), pay=S._pay||'wallet';
  const pr=checkPromo(S._promo); if(!pr.ok){ toast(pr.msg); return; }
  if(pay==='wallet' && S.wallet<hold){ toast('Wallet has '+rupee(S.wallet)+'. Add money or pay by UPI.'); walletModal(); return; }
  const start=()=>{
    const status = offer ? 'negotiating' : (c.instant?'confirmed':'requested');
    const id='b'+Date.now().toString(36);
    S.trip={id, ts:Date.now(), owner:ME.id, driverId:ME.id, driverName:DRIVER, vehicle:S.vehicle, battery:S.battery, hostName:c.host, kind:'charger', chargerId:c.id, status, slot, from:{...ME_POS}, to:{x:c.x,y:c.y}, progress:0, eta:etaMin(dist(c)), pin:String(1000+Math.floor(Math.random()*9000)),
      target:S._target||80, hold, pay, promo:pr.code||null, price, listPrice:p.price, negotiated:!!offer, offer: offer?{price:offer, state:'pending'}:null,
      kw:chargeKw(c), kwh:0, mins:0, fromPct:Math.round(S.battery), wait:0, photo:null, issue:null, rate:commissionFor(c)};
    S.selected=c.id; S.receipt=null; S._mode='book';
    const v=EVS[S.vehicle].name;
    if(offer){
      if(isMine(c) && offer>=c.minAccept*p.price){ acceptOffer(S.trip,offer,true); }
      else if(isMine(c)) notify('host', DRIVER+' offered ₹'+offer+'/kWh at '+c.title+' (you list ₹'+p.price+'). Accept, counter or decline.','🤝');
      notify('driver','Offer of ₹'+offer+'/kWh sent to '+c.host+'.','🤝');
    } else if(status==='requested'){ if(isMine(c)) notify('host', DRIVER+' ('+v+') requested '+c.title+' for '+slot+'.','📥'); notify('driver','Request sent to '+c.host+'.','📥'); }
    else { if(isMine(c)) notify('host', DRIVER+' booked '+c.title+' for '+slot+' (instant book).','✅'); notify('driver','Booked '+c.title+'. '+rupee(hold)+' on hold.','✅'); }
    save(); go('explore');
  };
  if(pay==='upi') upiModal(hold, c.title, start); else start();
}
function acceptOffer(t, price, auto){

  t.hold=Math.ceil(estimate(t.kw,price,t.target,t).amount*1.1);

  if(isMine(c)) notify('host', (auto?'Auto-accepted ':'You accepted ')+dn()+'\'s offer of ₹'+price+'/kWh at '+c.title+(auto?' (above your minimum).':'.'),'🤝');

function hostRespond(action, counter){ const t=S.trip; if(t) hostAct(t, {type:action, counter}); }
function hostAct(t, act){

  W.actions[t.id]={...act, seq:Date.now()}; save(); render(); toast('Sent. '+t.driverName+'\'s app will update in a moment.');

function applyAction(t, a){

    if(fee){ if(t.pay==='wallet') S.wallet-=fee; S.txns.unshift({t:'Cancellation fee', amt:-fee, when:'Just now'}); }

function arrive(t){ const c=t.chargerId?charger(t.chargerId):null, prev=CTX; CTX=t; t.status='arrived'; t.progress=1;

function startCharging(t){ const c=t.chargerId?charger(t.chargerId):null, prev=CTX; CTX=t; t.status='charging';
  notify('driver','PIN verified. Charging started at '+t.kw+' kW.','⚡'); if(isMine(c)) notify('host','Charging started for '+dn()+' at '+c.title+'.','⚡'); CTX=prev; save(); liveRender(); }
function chargeTick(t, silent){
  if(!t || t.status!=='charging') return;
  const v=EVS[t.vehicle||'nexon'], taper=t.battery>80?0.45:1, add=t.kw*taper*(2/60); t.kwh+=add; t.mins+=2;
  t.battery=Math.min(100, t.battery+add*0.92/v.cap*100);
  if(t.battery>=t.target){ t.battery=t.target; }
  if(t.driverId===ME.id) S.battery=t.battery;

function endTrip(t){

  const o=t.promo?OFFERS.find(x=>x.code===t.promo):null, discount=o?+o.calc(gross).toFixed(2):0;
  const paid=gross-discount, rate=t.kind==='van'?VAN.share:t.rate;

  const sid='s'+t.id;

  notify('driver','Paid '+rupee2(paid)+(t.pay==='wallet'?' from wallet':' by UPI')+'. Rate your '+(c?'host':'van operator')+'.','💳');
  if(isMine(c)) notify('host', dn()+' finished charging at '+c.title+'. You earned '+rupee2(gross*(1-rate)+bonus)+(bonus?' including the ₹50 evening bonus':'')+'.','💸');

/* the driver's own device turns a finished booking into a receipt and a wallet debit, once */
function settle(){
  for(const t of Object.values(W.bookings)){
    if(t.driverId!==ME.id || t.status!=='done' || !t.result || S.paid.includes(t.id)) continue;
    const r=t.result, c=t.chargerId?charger(t.chargerId):null; S.paid.push(t.id);
    const o=t.promo?OFFERS.find(x=>x.code===t.promo):null; if(o && o.once && !S.usedPromos.includes(t.promo)) S.usedPromos.push(t.promo);
    const adv=Math.min(t.advance||0, r.paid), bal=+(r.paid-adv).toFixed(2), refund=+((t.advance||0)-adv).toFixed(2);
    if(t.pay==='wallet') S.wallet=+(S.wallet-bal+refund).toFixed(2);
    S.txns.unshift({t:'Charging · '+(c?c.title:(t.planLabel||'Rescue van'))+(adv?' (balance after advance)':'')+(t.pay==='upi'?' (UPI)':''), amt:-bal, when:'Just now'});
    if(refund>0) S.txns.unshift({t:'Unused advance refunded', amt:refund, when:'Just now'});
    S.receipt={addons:t.addons||[], advance:t.advance||0, callout:t.callout, kind:t.kind, chargerId:t.chargerId, title:c?c.title:'Charging van rescue', vehicle:t.vehicle, kwh:t.kwh, price:t.price, energy:r.energy, gross:r.gross, discount:r.discount, promo:t.promo, pay:t.pay, mins:t.mins, from:t.fromPct, to:r.to, rate:r.rate, negotiated:t.negotiated};
    S._promo='';
  }
}

function liveTripCard(){
  const t=S.trip; if(!t || !isMine(charger(t.chargerId))) return '';
  const DRIVER=t.driverName, veh=EVS[t.vehicle||'nexon'].name, act=W.actions[t.id], waiting=act && act.seq>(t.actSeq||0);
  if(waiting) return `<div class="req hot"><div><b>${esc(DRIVER)}</b><br><span class="sub small">Your answer was sent. Waiting for ${esc(DRIVER)}'s app to pick it up…</span></div><div class="spinner" style="width:26px;height:26px;margin:0"></div></div>`;
  const c=charger(t.chargerId), lp=t.listPrice;
  let inner='';
  if(t.status==='negotiating' && t.offer.state==='pending') inner=`<div><b>${esc(DRIVER)}</b> <span class="sub small">★ 4.8 · ${veh}</span><br>Offers <b>₹${t.offer.price}/kWh</b> for ${esc(c.title)} (you list ₹${lp}). ${esc(t.slot)}.</div>
     <div class="stack" style="gap:6px"><div class="row"><button class="btn sm" id="hAcc">Accept ₹${t.offer.price}</button><button class="btn sm ghost" id="hDec">Decline</button></div>
     <div class="row"><input type="number" id="hCounter" class="chatin" style="width:90px;flex:none" min="${t.offer.price+1}" max="${lp}" value="${Math.round((t.offer.price+lp)/2)}" aria-label="Counter price per kWh"><button class="btn sm ghost" id="hCnt">Counter</button></div></div>`;
  else if(t.status==='negotiating') inner=`<div>Counter-offer of ₹${t.offer.counter}/kWh sent to <b>${esc(DRIVER)}</b>. Waiting for their answer.</div><span></span>`;
  else if(t.status==='requested') inner=`<div><b>${esc(DRIVER)}</b> <span class="sub small">★ 4.8 · verified driver · ${veh}</span><br>Requests ${esc(c.title)} · ${esc(t.slot)} · ₹${t.price}/kWh</div><div class="row"><button class="btn sm" id="hAcc">Accept</button><button class="btn sm ghost" id="hDec">Decline</button></div>`;
  else if(t.status==='confirmed') inner=`<div><b>${esc(DRIVER)}</b> is booked at ${esc(c.title)} for ${esc(t.slot)} at ₹${t.price}/kWh. Waiting for them to start driving.</div><span></span>`;

  else if(t.status==='arrived') inner=`<div><b>${esc(DRIVER)} has arrived.</b> Ask for their 4-digit PIN and enter it to start the session.<br><span class="sub small">${t.driverId==='sim'?`Demo driver: ${esc(DRIVER.split(' ')[0])} reads out <b class="num">${t.pin}</b>.`:`The PIN is on ${esc(DRIVER.split(' ')[0])}'s screen.`}</span>${t.photo?`<div class="photos" style="margin-top:6px"><div class="ph"><img src="${t.photo}" alt="Driver's check-in photo"></div></div>`:''}</div>
     <form class="row" id="pinForm"><input class="pinin" id="pinIn" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" aria-label="Driver PIN" required><button class="btn sm" type="submit">Start</button></form>`;
  else if(t.status==='charging') inner=`<div><span class="live"><span class="dot"></span>Charging ${esc(DRIVER)}'s ${veh}</span><br><span class="sub small">${esc(c.title)} · <span id="hKwh">${t.kwh.toFixed(2)} kWh</span> · you earn <span id="hEarn">${rupee2(t.kwh*t.price*(1-t.rate))}</span></span>${t.issue?`<div class="warnbox" style="margin-top:6px">Driver reported a problem. <img src="${t.issue}" alt="Problem photo" style="max-width:120px;display:block;border-radius:6px;margin-top:4px"></div>`:''}</div>
     <button class="btn sm danger" id="hStop">Stop session</button>`;

    const show=()=>{ const r=g.getBoundingClientRect(), bb=box.getBoundingClientRect(); tip.hidden=false; tip.style.left=(r.left-bb.left+r.width/2)+'px'; tip.style.top=(r.top-bb.top+20)+'px'; tip.innerHTML=`<b>${d.label}</b> · ${d.n} sessions<br>Fees ${rupee(d.comm)} · Vans ${rupee(d.van)}`; };
    g.addEventListener('mouseenter',show); g.addEventListener('focus',show); g.addEventListener('mouseleave',()=>tip.hidden=true); g.addEventListener('blur',()=>tip.hidden=true); });

function revenueChart(days){
  const W=520,H=230,L=46,R=10,T=14,B=28, max=Math.max(1,...days.map(d=>d.comm+d.van)), step=max>400?100:50, top=Math.ceil(max/step)*step;
  const y=v=>T+(H-T-B)*(1-v/top), slot=(W-L-R)/days.length, bw=slot*0.56;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Daily revenue chart">`;
  for(let v=0;v<=top;v+=step) s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">₹${v}</text>`;
  days.forEach((d,i)=>{ const cx=L+(i+0.5)*slot, x=cx-bw/2, yc=y(Math.max(0,d.comm)), yv=y(Math.max(0,d.comm)+d.van);
    s+=`<g data-day="${i}" tabindex="0"><rect x="${cx-slot/2}" y="${T}" width="${slot}" height="${H-T-B}" fill="transparent"/>`;
    const hc=y(0)-yc; if(hc>0) s+=`<rect x="${x}" y="${yc}" width="${bw}" height="${hc}" fill="var(--accent)"/>`;
    const hv=yc-yv-2; if(hv>4) s+=`<path d="M${x} ${yc-2} v${-(hv-4)} q0 -4 4 -4 h${bw-8} q4 0 4 4 v${hv-4}z" fill="var(--amber)"/>`;
    s+=`<text x="${cx}" y="${H-10}" text-anchor="middle">${d.label}</text></g>`; });
  return s+'</svg>';
}

  if(spBusy && !spLog()[spLog().length-1]._live) h+='<div class="spmsg bot"><span class="who">Assistant</span>Typing…</div>';
  body.innerHTML=h; body.scrollTop=body.scrollHeight;
  $('#spStatus').textContent = tk ? (tk.status==='closed'?'Ticket resolved':'Connected to the support team') : 'Assistant · replies instantly';
  const q=$('#spQuick'); q.innerHTML = tk ? '' : (SUPPORT_QUICK[S.portal]||SUPPORT_QUICK.home).map(t=>`<button type="button" data-spq="${esc(t)}">${esc(t)}</button>`).join('')+'<button type="button" data-sphuman>Talk to a person</button>';
  q.querySelectorAll('[data-spq]').forEach(b=>b.onclick=()=>spAsk(b.dataset.spq));
  const hb=q.querySelector('[data-sphuman]'); if(hb) hb.onclick=spEscalate;
}
function spContext(){
  const t=S.trip, c=t&&t.chargerId?charger(t.chargerId):null, v=EVS[S.vehicle];
  const near=S.chargers.filter(x=>x.active).slice(0,8).map(x=>`${x.title} (${x.area}, ${x.conn}, ${x.kw} kW, ₹${priceOf(x).price}/kWh, ${x.status})`).join('; ');
  return `Viewer: ${DRIVER}, using the ${S.portal==='host'?'Host':S.portal==='driver'?'Driver':'landing'} side. Car: ${v?v.name:'unknown'}, battery ${Math.round(S.battery)}%. Wallet ₹${S.wallet}.
Active booking: ${t?`${t.status} at ${c?c.title:'charging van'}, ₹${t.price}/kWh`:'none'}.
Chargers listed: ${near}.
Driver coupons: ${OFFERS.filter(o=>o.aud==='driver').map(o=>o.code+' ('+o.title+')').join(', ')}.`;
}
const SP_RULES=`You are the customer support assistant for VoltPool, a peer-to-peer EV charging marketplace in Bengaluru. Drivers book home and shop chargers listed by hosts. Chargers come in three speeds: Fast DC (25 kW and up, CCS2, about 1 hour for a car), Standard AC (7 to 22 kW, Type 2, 3 to 5 hours), and Slow (up to 3.3 kW sockets, LECCS or Bharat AC-001, for scooters and e-autos). Use the speed tabs on Explore to filter.
Facts: drivers pay only for the energy their battery takes, in kWh measured by the charger's meter (e.g. a Nexon car from 20% to 80% takes about 20 kWh, an Ather scooty from 10% to full about 3 kWh). Supported vehicles: cars (Nexon EV, Tiago EV, MG ZS EV), scooties (Ather 450X, Ola S1 Pro, TVS iQube), e-autos and the Tata Ace EV cargo van, chosen with the Car/Scooty/E-auto/Cargo van switch on Explore. Drivers pay per kWh actually delivered, by wallet or UPI. Free cancellation before charging starts. Drivers can offer their own price on chargers that accept offers; hosts accept, decline or counter. On arrival the driver reads a 4-digit PIN to the host to start. "Charge now" matches the nearest free compatible charger. Van charging (Van charging tab): Emergency rescue sends the nearest van to a stranded EV (₹199 call-out plus ₹22/kWh, enough charge to reach a charger); Doorstep top-up charges a parked EV to 80% at home or work (₹99 call-out plus ₹22/kWh, can be scheduled). Van visits can add services: tyre pressure ₹49, washer water ₹29, waterless wash ₹199, puncture repair ₹149, EV health check ₹149, minor repairs ₹249 (parts extra). VoltPool Premium costs ₹299 a month: free tyre and water on every visit, 50% off call-outs, priority dispatch, 15% off other services, and members-only full valet ₹499, battery health report ₹299 and spare wheel fitting ₹299. Van bookings take an advance at booking (₹150 for rescue, ₹100 for doorstep), which is deducted from the final bill; cancelling within 2 minutes refunds it, after that it is kept for the driver's trip. Works for cars, e-autos and cargo vans like the Tata Ace EV. Hosts set a base price with time-of-day adjustments: morning (6-11 am) and night (10 pm-6 am) cost more, evening a little more, daytime is cheapest; optional demand pricing adds up to +15%. VoltPool fee is 15% of each session (10% with the FEE10 host offer). Host payouts every Friday. Phone numbers stay private; drivers and hosts chat in the app.
Answer in 1 to 4 short sentences, plain friendly English, no markdown, no lists. Use the viewer's context when relevant. Never invent refunds, account changes or facts you were not given: for anything that needs an account action, say a person from the team can help and suggest tapping "Talk to a person".`;
async function spAsk(text){
  text=(text||'').trim(); if(!text || spBusy) return;
  const tk=myTicket();
  if(tk){ tk.msgs.push({from:'user', t:text, ts:Date.now()}); tk.status='open'; tk.ts=Date.now(); save(); drawSupport(); return; }
  const log=spLog(); log.push({from:'user', t:text}); spBusy=true; save(); drawSupport();
  let answer='';
  if(sampleCap){
    const turns=log.filter(m=>!m._live).slice(-10).map(m=>({role:m.from==='user'?'user':'assistant', content:m.t}));
    while(turns.length && turns[0].role!=='user') turns.shift();
    turns[0]={role:'user', content:SP_RULES+'\n\nContext right now:\n'+spContext()+'\n\nCustomer: '+turns[0].content};
    const live={from:'bot', t:'', _live:true}; let shown=false;
    try{ spAbort=new AbortController();
      const r=await sampleCap(turns,{cache:false, modelTier:'quick', signal:spAbort.signal, onText:({text})=>{ if(!text || text.startsWith('Thinking')) return; if(!shown){ log.push(live); shown=true; } live.t=text; drawSupport(); }});
      answer=(r&&r.text||'').trim(); if(shown) log.splice(log.indexOf(live),1);
    }catch(e){ if(shown) log.splice(log.indexOf(live),1); if(e && e.code==='not_granted') sampleCap=null; answer=''; }
  }
  if(!answer){ const l=text.toLowerCase(), hit=FAQ.find(([re])=>re.test(l));
    answer = hit ? hit[1] : /work|what is|how does/.test(l) ? 'Drivers find a home or shop charger nearby, book it, and pay only for the energy they use. Hosts list their charger, set their prices and earn from every session. One account does both.' : 'I am not sure about that one. Tap "Talk to a person" and someone from the VoltPool team will reply here.'; }
  log.push({from:'bot', t:answer}); spBusy=false; save(); drawSupport();
}
function spEscalate(){
  if(myTicket()) return;
  const id='t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const recent=spLog().filter(m=>m.from==='user').slice(-3).map(m=>m.t).join(' / ') || 'Needs help';
  W.support[id]={id, user:ME.id, name:DRIVER, portal:S.portal, ts:Date.now(), status:'open', msgs:[{from:'user', t:recent, ts:Date.now()}]};
  S.ticket=id; spLog().push({from:'bot', t:'I have passed this to the VoltPool team with your messages so far. Someone will reply right here, usually within 15 minutes.'});
  save(); drawSupport();
}
function supportInbox(){
  const tks=Object.values(W.support).sort((a,b)=>(a.status==='closed')-(b.status==='closed') || b.ts-a.ts).slice(0,8);
  return `<div class="panel stack"><div class="spread"><h2>Support tickets</h2><span class="pill ${tks.some(t=>t.status==='open')?'busy':'off'}">${tks.filter(t=>t.status==='open').length} open</span></div>
    ${tks.length?tks.map(t=>`<div class="ticket"><div class="spread"><b>${esc(t.name)} · ${t.portal==='host'?'Host':'Driver'}</b><span class="sub small">#${esc(t.id.slice(-5).toUpperCase())} · ${t.status==='closed'?'Resolved':'Open'}</span></div>
      <div class="thread">${t.msgs.map(m=>`<div><b>${m.from==='agent'?'Support':'Customer'}:</b> ${esc(m.t)}</div>`).join('')}</div>
      ${t.status==='closed'?'':`<form class="row" data-tkform="${esc(t.id)}"><input name="r" placeholder="Reply to ${esc(t.name.split(' ')[0])}" aria-label="Reply" style="flex:1;min-width:0"><button class="btn sm">Reply</button><button class="btn sm ghost" type="button" data-tkclose="${esc(t.id)}">Resolve</button></form>`}</div>`).join(''):'<div class="empty">No support tickets yet. They appear here when someone taps "Talk to a person" in the help chat.</div>'}</div>`;
}
function wireInbox(){
  app.querySelectorAll('[data-tkform]').forEach(f=>f.onsubmit=e=>{ e.preventDefault(); const t=W.support[f.dataset.tkform], v=f.r.value.trim(); if(!t||!v) return; t.msgs.push({from:'agent', t:v, ts:Date.now()}); save(); render(); toast('Reply sent'); });

}

$('#bellBtn').onclick=toggleNotifs;

};
document.querySelectorAll('.pswitch button').forEach(b=> b.onclick=()=>switchPortal(b.dataset.p));

/* Host portal: drivers are simulated, so a host can try the whole flow alone */
/* Host site: drivers are simulated, so a host can try the whole flow alone */
function simDriver(){
  const mine=myChargers().filter(c=>c.active); if(!mine.length) return;
  const c=mine[Math.floor(Math.random()*mine.length)], p=priceOf(c);
  const kind = c.negotiable && Math.random()<0.6 ? 'offer' : (c.instant?'instant':'request');
  const offer = kind==='offer' ? Math.max(5,Math.round(p.price*(0.74+Math.random()*0.14))) : null;
  const name=SIM_NAMES[Math.floor(Math.random()*SIM_NAMES.length)], battery=20+Math.floor(Math.random()*15), id='b'+Date.now().toString(36);
  const t={id, ts:Date.now(), owner:ME.id, driverId:'sim', driverName:name, vehicle:'nexon', battery, hostName:c.host, kind:'charger', chargerId:c.id, status: offer?'negotiating':kind==='instant'?'confirmed':'requested', slot:'In 20 min', from:{...ME_POS}, to:{x:c.x,y:c.y}, progress:0, eta:etaMin(dist(c)),
    pin:String(1000+Math.floor(Math.random()*9000)), target:80, hold:0, pay:'wallet', promo:null, price:offer||p.price, listPrice:p.price, negotiated:!!offer, offer:offer?{price:offer,state:'pending'}:null,
    kw:Math.min(c.kw, EVS.nexon.ac), kwh:0, mins:0, fromPct:battery, wait:0, photo:null, issue:null, rate:commissionFor(c)};
  W.bookings[id]=t; const prev=CTX; CTX=t;
  if(offer){ if(offer>=c.minAccept*p.price) acceptOffer(t,offer,true); else notify('host', name+' offered ₹'+offer+'/kWh at '+c.title+' (you list ₹'+p.price+'). Accept, counter or decline.','🤝'); }
  else if(kind==='request') notify('host', name+' (Tata Nexon EV) requested '+c.title+' for in 20 min.','📥');
  else notify('host', name+' booked '+c.title+' (instant book). Arriving soon.','✅');
  CTX=prev; save(); liveRender();
}
/* the world clock: each device advances only the bookings it owns */
let n=0, idle=0;
setInterval(()=>{
  n++;
  const owned=Object.values(W.bookings).filter(t=>t.owner===ME.id && ACTIVE.includes(t.status));
  if(S.portal==='host' && mode!=='connecting' && !Object.values(W.bookings).some(t=>ACTIVE.includes(t.status) && isMine(charger(t.chargerId)))){ if(++idle>=60){ idle=0; simDriver(); } } else idle=0;
  for(const t of owned){
    const c=t.chargerId?charger(t.chargerId):null; CTX=t;
    const a=W.actions[t.id]; if(a && a.seq>(t.actSeq||0)){ t.actSeq=a.seq; applyAction(t,a); continue; }
    if(t.driverId==='sim'){
      if(t.status==='negotiating' && t.offer.state==='countered' && ++t.wait>=5){ t.wait=0; t.price=t.offer.counter; t.offer.state='accepted'; t.status='confirmed'; notify('host', t.driverName+' accepted your counter-offer of ₹'+t.price+'/kWh. Booking confirmed.','🤝'); save(); liveRender(); continue; }
      if(t.status==='confirmed' && ++t.wait>=5){ t.wait=0; t.status='enroute'; t.progress=0; notify('host', t.driverName+' is on the way to '+c.title+' · '+t.eta+' min.','🚗'); save(); liveRender(); continue; }
    } else if(c && !isMine(c)){
      if(t.status==='requested' && ++t.wait>=6){ t.status='confirmed'; notify('driver', c.host+' accepted your request.','✅'); save(); liveRender(); continue; }
      if(t.status==='negotiating' && t.offer.state==='pending' && ++t.wait>=6){ if(t.offer.price>=c.minAccept*t.listPrice) acceptOffer(t,t.offer.price,false); else { t.offer.counter=Math.round((t.offer.price+t.listPrice)/2); t.offer.state='countered'; notify('driver', c.host+' countered with ₹'+t.offer.counter+'/kWh.','🤝'); } save(); liveRender(); continue; }
    }
    if(t.status==='enroute'){
      t.progress=Math.min(1, t.progress+0.25/t.eta);
      if(t.progress>=1){ arrive(t); continue; }
      if(S.trip===t){ const mv=$('#mover'); if(mv){ const p=moverPos(t); mv.setAttribute('transform',`translate(${p.x} ${p.y})`); }
        const left=Math.max(1,Math.ceil(t.eta*(1-t.progress))); ['eta','hEta'].forEach(id=>{ const e=$('#'+id); if(e) e.textContent=id==='eta'?left+' min':left; }); }
      if(n%4===0) save();
    }
    else if(t.status==='charging'){ chargeTick(t,false); if(S.trip===t && t.status==='charging') updateChargeUI(); if(n%4===0) save(); }
  }
  CTX=null;
}, 500);

/* connect to the shared database; until then (or without it) the page runs on this device */
function applySnapshot(col, snap){
  let fresh=false, relevant=false;
  for(const ch of snap.docChanges()){
    const id=ch.doc.id, p=col+'/'+id;
    if(ch.type==='removed'){ delete W[col][id]; delete sent[p]; relevant=true; continue; }
    const data=JSON.parse(JSON.stringify(ch.doc.data()||{}));
    const j=ser(data); if(sent[p]===j && W[col][id]) continue;
    sent[p]=j; relevant=true;
    const cur=W[col][id];
    if(cur){ Object.keys(cur).forEach(k=>{ if(k[0]!=='_') delete cur[k]; }); Object.assign(cur,data); } else W[col][id]=data;
    if(col==='notifs' && !seenIds.has(id)){ seenIds.add(id); if(data.ts>BOOT && ch.type==='added' && data.role===S.portal && (data.role==='host'||data.to===ME.id)) fresh=data.t; }
  }
  if(col==='settings' && !W.settings.host) W.settings.host={};
  if(col==='support'){ drawSupport(); if(S.portal==='host' && S.view.host==='platform' && !$('#modalRoot').innerHTML) relevant=true; }
  if(fresh) toast(fresh);
  if(relevant){ settle(); liveRender(); }
}
const BOOT=Date.now();
(async()=>{
  if(!window.claude || !window.claude.use){ mode='local'; renderChrome(); return; }
  mode='connecting'; renderChrome();
  const [d,u,a,sm]=await Promise.all(['db','user','assets','sample'].map(n=>window.claude.use(n).catch(()=>null)));
  sampleCap=sm||null;
  if(u){ try{ const id=await u.id(); if(id) ME.id=id; const me=await u.me(); if(me && me.name) DRIVER=me.name; }catch(e){} }
  assets=a||null;
  if(!d){ mode='local'; ME.id=L.me; renderChrome(); return; }
  db=d; mode='live';
  COLS.forEach(c=>{ W[c]={}; }); W.settings.host={};
  COLS.forEach(c=>{ db.collection(c).onSnapshot(snap=>applySnapshot(c,snap), err=>{ mode='local'; renderChrome(); toast('Lost the live connection. Reload to reconnect.'); }); });
  render();
})();
})();
